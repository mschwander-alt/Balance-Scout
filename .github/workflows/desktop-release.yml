name: Windows-Installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Abhängigkeiten
        working-directory: desktop
        run: npm ci
      - name: Tests
        working-directory: desktop
        # Ende-zu-Ende-Test braucht den Server – läuft im CI-Ablauf
        run: npx vitest run --exclude "test/e2e.server.test.ts"
      - name: Installer bauen (MSI + EXE)
        working-directory: desktop
        shell: pwsh
        env:
          WIN_CERT_PFX_BASE64: ${{ secrets.WIN_CERT_PFX_BASE64 }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          # Signieren nur, wenn ein Zertifikat als Secret hinterlegt ist
          if ($env:WIN_CERT_PFX_BASE64) {
            $env:CSC_LINK = $env:WIN_CERT_PFX_BASE64
            $env:CSC_KEY_PASSWORD = $env:WIN_CERT_PASSWORD
          } else {
            $env:CSC_IDENTITY_AUTO_DISCOVERY = 'false'
            Write-Host 'Kein Zertifikat hinterlegt – Installer wird unsigniert gebaut.'
          }
          npm run build
          npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: balance-scout-windows
          path: |
            desktop/release/*.msi
            desktop/release/*.exe
          if-no-files-found: error
